name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 瀏覽次數 API（Google Apps Script 網址），於 repo Settings → Secrets and variables → Actions → Variables 設定
          VITE_VIEW_COUNTER_URL: ${{ vars.VIEW_COUNTER_URL }}
      # 檢查瀏覽次數 API 是否可用（只讀取，不增加次數；失敗不影響部署）
      - name: Check view counter
        continue-on-error: true
        run: |
          url="${{ vars.VIEW_COUNTER_URL }}"
          [ -z "$url" ] && url=$(grep -oE 'https://script\.google\.com/macros/s/[^'"'"']+/exec' src/config/site.ts | head -1)
          res=$(curl -sSL -m 20 -D /tmp/h "$url?action=get" || true)
          cors=$(grep -i '^access-control-allow-origin' /tmp/h | tail -1 | tr -d '\r')
          echo "::notice title=View counter::response=${res:0:120} | ${cors:-no CORS header}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 若 repo 的 Pages 來源仍是「Deploy from a branch」，GitHub 會同時發布未建置的原始碼（網頁會一片空白）。
      # 等它完成後再發布建置版本，確保最後上線的是正確版本。
      # 根本解法：Settings → Pages → Source 改為「GitHub Actions」。
      - name: Wait for legacy branch deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 48); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=30" \
              --jq '[.workflow_runs[] | select((.name == "pages build and deployment" or (.path | contains("pages-build-deployment"))) and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then echo "No pending legacy deployment"; sleep 5; break; fi
            echo "Waiting for legacy pages-build-deployment ($i)..."
            sleep 5
          done
      - id: deployment
        uses: actions/deploy-pages@v4
